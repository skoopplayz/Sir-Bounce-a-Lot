<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF5EB" />
      <stop offset="100%" stop-color="#E1F0F7" />
    </radialGradient>
    <radialGradient id="princeBody" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF7B90" />
      <stop offset="70%" stop-color="#EE4266" />
      <stop offset="100%" stop-color="#C72C4F" />
    </radialGradient>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE866" />
      <stop offset="100%" stop-color="#F2B705" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3D1A24" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="128" height="128" rx="28" fill="url(#skyGlow)"/>
  
  <!-- Inflatable Seam Dots Background -->
  <circle cx="20" cy="20" r="3" fill="#D3E5EE"/>
  <circle cx="108" cy="20" r="3" fill="#D3E5EE"/>
  <circle cx="108" cy="108" r="3" fill="#D3E5EE"/>
  <circle cx="20" cy="108" r="3" fill="#D3E5EE"/>

  <!-- Trampoline Arc -->
  <path d="M 14 105 Q 64 122 114 105" stroke="#3BD8D6" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 24 107 Q 64 120 104 107" stroke="#FFE866" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="4 4"/>

  <!-- Prince Cape (behind body) -->
  <path d="M 44 65 Q 26 80 32 98 Q 48 94 54 85 Z" fill="#78290F" opacity="0.8"/>

  <!-- Prince Body (Squishy rounded bean/pill shape) -->
  <ellipse cx="64" cy="68" rx="34" ry="32" fill="url(#princeBody)" filter="url(#shadow)"/>
  
  <!-- Inflatable Vinyl Specular Shine -->
  <ellipse cx="50" cy="52" rx="10" ry="6" fill="#FFFFFF" opacity="0.45" transform="rotate(-20 50 52)"/>

  <!-- Crown -->
  <polygon points="46,42 42,26 53,34 64,22 75,34 86,26 82,42" fill="url(#crownGold)" stroke="#3D1A24" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="64" cy="30" r="2.5" fill="#EE4266"/>
  <circle cx="48" cy="32" r="2" fill="#3BD8D6"/>
  <circle cx="80" cy="32" r="2" fill="#3BD8D6"/>

  <!-- Snipperclips Style Big Cute Eyes -->
  <!-- Left Eye -->
  <ellipse cx="52" cy="66" rx="8" ry="10" fill="#FFFFFF" stroke="#3D1A24" stroke-width="2.2"/>
  <ellipse cx="54" cy="66" rx="4.5" ry="5.5" fill="#241E20"/>
  <circle cx="56" cy="64" r="2" fill="#FFFFFF"/>

  <!-- Right Eye -->
  <ellipse cx="76" cy="66" rx="8" ry="10" fill="#FFFFFF" stroke="#3D1A24" stroke-width="2.2"/>
  <ellipse cx="78" cy="66" rx="4.5" ry="5.5" fill="#241E20"/>
  <circle cx="80" cy="64" r="2" fill="#FFFFFF"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="43" cy="74" rx="4" ry="2.5" fill="#FF2E63" opacity="0.45"/>
  <ellipse cx="85" cy="74" rx="4" ry="2.5" fill="#FF2E63" opacity="0.45"/>

  <!-- Happy Smiling Mouth -->
  <path d="M 59 75 Q 64 82 69 75" stroke="#3D1A24" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Star Sparkles -->
  <polygon points="98,34 100,38 104,40 100,42 98,46 96,42 92,40 96,38" fill="#FFE866"/>
  <polygon points="26,44 27.5,47 30.5,48.5 27.5,50 26,53 24.5,50 21.5,48.5 24.5,47" fill="#3BD8D6"/>
</svg>